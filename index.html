<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Wafiq</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800;9..144,400&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a0f3d; --bg2:#2b1366; --ink:#fff6e0; --muted:#cbbfee;
  --gold:#ffc83d; --pink:#ff5c8a; --card:#ffffff14;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){ :root{ color-scheme: dark; } }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));
  padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);
  display:flex;flex-direction:column;align-items:center;
  text-align:center;overflow-y:auto;
}
canvas{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:460px;width:100%;margin:auto 0;padding:24px 0}
.small{font-size:1.1rem;color:var(--muted);margin:0 0 6px}
h1{
  font-family:"Fraunces",Georgia,serif;font-weight:800;
  font-size:clamp(2.6rem,13vw,4.6rem);line-height:1;margin:0 0 6px;
  color:var(--gold);letter-spacing:-.02em;
}
h2{
  font-family:"Fraunces",Georgia,serif;font-weight:400;
  font-size:clamp(2.4rem,12vw,4rem);margin:0 0 28px;color:var(--ink);
}
.cake{font-size:4.2rem;margin-bottom:10px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.cake{animation:none}}
.photo{display:block;margin:0 auto 16px;width:170px;height:218px;object-fit:cover;
  border-radius:999px 999px 28px 28px;border:3px solid var(--gold);
  box-shadow:0 0 0 7px #ffc83d26,0 16px 40px #0009}
.mpesa{background:#43b02a;color:#fff;font-weight:700;font-size:.8rem;padding:3px 10px;
  border-radius:999px;margin-right:6px;letter-spacing:.04em}
.gift{
  display:inline-block;color:var(--ink);font-weight:600;font-size:1.05rem;
  text-decoration:none;padding:14px 24px;border-radius:999px;cursor:pointer;
  background:var(--pink);border:0;font-family:inherit;
  box-shadow:0 8px 24px #ff5c8a55;
}
.gift:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.gift:active{transform:scale(.97)}
#reveal{
  display:none;margin-top:24px;padding:26px 20px 22px;border-radius:26px;position:relative;
  background:linear-gradient(160deg,#ffffff22,#ffffff0a);
  border:2px solid var(--gold);box-shadow:0 0 0 6px #ffc83d1f,0 20px 50px #0008;
}
#reveal.open,#reveal:target{display:block;animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
#giftBtn:has(~ #reveal:target){display:none}
@keyframes pop{from{transform:scale(.7) rotate(-2deg);opacity:0}}
#reveal .box{font-size:2.6rem;line-height:1}
#reveal .msg{margin:10px 0 18px;line-height:1.5;font-size:1.05rem}
#reveal .lbl{margin:0 0 8px;font-size:.95rem;color:var(--muted)}
#reveal .num{
  font-family:"Fraunces",Georgia,serif;font-weight:800;color:var(--gold);
  font-size:clamp(1.9rem,9.5vw,2.7rem);letter-spacing:.02em;margin:0 0 16px;
  padding:14px 8px;border-radius:16px;background:#00000040;border:1px dashed #ffc83d99;
  user-select:all;-webkit-user-select:all;
}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{
  flex:1 1 140px;font-family:inherit;font-weight:600;font-size:1rem;cursor:pointer;
  padding:13px 16px;border-radius:14px;border:0;text-decoration:none;color:var(--bg);
  background:var(--gold);
}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid #ffffff55}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn:active{transform:scale(.97)}
#note{min-height:1.4em;margin:14px 0 0;font-size:.95rem;color:var(--gold)}
.thanks{margin:6px 0 0;font-size:.9rem;color:var(--muted)}
</style>
</head>

<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,bits=[];
  var cols=['#ffc83d','#ff5c8a','#5cd6ff','#9d7bff','#7dffb2'];
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  size();addEventListener('resize',size);
  function burst(n,x,y){
    for(var i=0;i<n;i++){
      bits.push({x:x==null?Math.random()*W:x,y:y==null?-10:y,
        vx:(Math.random()-.5)*(y==null?2:9),vy:y==null?Math.random()*2+1:-Math.random()*9-2,
        s:Math.random()*7+4,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.3});
    }
  }
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=bits.length-1;i>=0;i--){
      var b=bits[i];b.x+=b.vx;b.y+=b.vy;b.vy+=.12;b.r+=b.vr;
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.fillStyle=b.c;
      ctx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2);ctx.restore();
      if(b.y>H+20)bits.splice(i,1);
    }
    requestAnimationFrame(tick);
  }
  if(!reduce){burst(90);tick();}
  document.getElementById('giftBtn').addEventListener('click',function(e){
    e.preventDefault();
    document.getElementById('reveal').classList.add('open');
    this.style.display='none';
    if(!reduce){burst(120,W/2,H*0.6);}
  });
  var note=document.getElementById('note');
  function done(ok){
    note.textContent=ok?'Number copied. Thank you! 🎉':'Press and hold the number to copy it.';
    if(ok&&!reduce)burst(60,W/2,H*0.5);
  }
  document.getElementById('copyBtn').addEventListener('click',function(){
    var t='0114905274';
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(function(){done(true)},function(){fallback()});
      }else{fallback();}
    }catch(e){fallback();}
    function fallback(){
      try{
        var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';
        document.body.appendChild(a);a.select();var ok=document.execCommand('copy');
        document.body.removeChild(a);done(ok);
      }catch(e){done(false);}
    }
  });
})();
</script>
